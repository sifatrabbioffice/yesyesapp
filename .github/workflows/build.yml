Name: Build EXE and IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ] # Trigger on version tags
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller -r requirements.txt

    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name "YesYesApp" app.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe
        path: dist/YesYesApp.exe

  build-ios:
    runs-on: macos-14 # Using M1 runners for faster builds
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Briefcase
      run: |
        python -m pip install --upgrade pip
        pip install briefcase

    - name: Briefcase Create & Build
      run: |
        # --no-input bypasses prompts in CI
        briefcase create iOS --no-input
        briefcase build iOS --no-input

    - name: Package Unsigned IPA
      run: |
        # Briefcase typically places the .app in a specific directory structure
        # based on the bundle and project name from pyproject.toml
        mkdir -p Payload
        APP_DIR=$(find build/yesyesapp/ios/xcode -name "*.app" -type d | head -n 1)
        
        if [ -z "$APP_DIR" ]; then
          echo "Error: .app bundle not found."
          exit 1
        fi
        
        cp -R "$APP_DIR" Payload/
        zip -r YesYesApp.ipa Payload
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa
        path: YesYesApp.ipa

  release:
    needs: [build-windows, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/windows-exe/YesYesApp.exe
          artifacts/ios-ipa/YesYesApp.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
