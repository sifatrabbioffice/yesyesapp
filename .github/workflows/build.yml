name: Build EXE and IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "YesYesApp" app.py

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v6
      with:
        name: windows-exe
        path: dist/YesYesApp.exe

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/YesYesApp.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6  # ← was v4, now fixed

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Xcode tools
      run: xcode-select --install || true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install briefcase
        pip install -r requirements.txt

    - name: Create iOS project with Briefcase
      run: briefcase create iOS

    - name: Build iOS app with Briefcase
      run: briefcase build iOS

    - name: Package IPA (unsigned, ready for sideloading)
      run: |
        # Briefcase outputs to build/yesyesapp/ios/xcode/
        # Find the .app bundle Briefcase produced
        APP_PATH=$(find build -name "*.app" -type d | head -1)
        echo "Found app at: $APP_PATH"

        # Create proper iOS IPA structure: Payload/<AppName>.app
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/

        # Zip into IPA
        zip -r YesYesApp.ipa Payload/
        echo "IPA created successfully"
        ls -lh YesYesApp.ipa

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v6
      with:
        name: ios-ipa
        path: YesYesApp.ipa

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: YesYesApp.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
